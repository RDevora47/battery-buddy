# Pushing a v* tag (made by build.ps1 -Release) builds both downloads and publishes a GitHub release with them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test, build and zip
        shell: pwsh
        run: ./build/build.ps1 -Package

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem build/release/*.zip).FullName --title "Battery Buddy ${{ github.ref_name }}" --generate-notes
