# Pushing a v* tag (made by build.ps1 -Release) builds it and publishes a GitHub release with the zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test and build
        shell: pwsh
        run: ./build/build.ps1 -SelfContained

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "BatteryBuddy-${{ github.ref_name }}-win-x64.zip"
          Get-ChildItem build/out -Exclude .gitkeep | Compress-Archive -DestinationPath $zip
          gh release create "${{ github.ref_name }}" $zip --title "Battery Buddy ${{ github.ref_name }}" --generate-notes
